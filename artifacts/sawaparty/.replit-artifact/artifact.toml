kind = "web"
previewPath = "/"
title = "SawaParty"
version = "1.0.0"
id = "artifacts/sawaparty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18916

[services.development]
run = "pnpm --filter @workspace/sawaparty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sawaparty", "run", "build" ]
publicDir = "artifacts/sawaparty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18916"
BASE_PATH = "/"
